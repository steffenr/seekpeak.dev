name: Validate

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          corepack prepare yarn@4.14.1 --activate

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/node/corepack
            ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate
        run: yarn validate

  validate-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      # Ubuntu's tzdata package omits the backward-compatible IANA aliases
      # (Asia/Calcutta, US/Eastern, ...) into tzdata-legacy, and the PPA PHP build
      # reads the system tzdb rather than timelib's bundled copy. Without this,
      # DateTimeZone::ALL_WITH_BC loses those aliases and the alias test 400s.
      - name: Install legacy timezone aliases (tzdata-legacy)
        run: sudo apt-get update && sudo apt-get install -y tzdata-legacy

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: api
        run: vendor/bin/phpunit