version: 2
updates:
  # keep the workflow actions current (grouped into one PR)
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
  # keep the Symfony/PHP dependencies in the api/ subdirectory current
  - package-ecosystem: composer
    directory: /api
    target-branch: develop
    schedule:
      interval: monthly
